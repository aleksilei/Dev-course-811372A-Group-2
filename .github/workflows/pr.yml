# Every pull request: lint, the unit and integration tests, and the e2e tests
# on freshly built images. `can-merge` sums them up.
name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - run: make install

      - name: Build the images and run the e2e tests
        run: make e2e
        env:
          E2E_LOGS: e2e-compose.log

      - name: Keep the container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-compose-log
          path: e2e-compose.log

  # The one check that says whether the PR can be merged. GitHub can't enforce
  # it on this private repo (no branch protection on GitHub Free), so it is
  # advisory: don't merge while it is red. With branch protection, require
  # this check alone.
  can-merge:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "test, e2e: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
