# Lint and the unit and integration tests (make lint, make test). Called by
# pr.yml and release.yml.
name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The base image of the Dockerfiles, with the OpenSSL >= 3.5 that the ML-KEM
    # tests need. The runner's own Python links OpenSSL 3.0, where pytest would
    # skip them.
    container: python:3.15-slim
    steps:
      # Node runs the control panel's JavaScript tests (make test).
      - name: Install make and Node.js
        run: apt-get update && apt-get install --yes --no-install-recommends make nodejs

      - uses: actions/checkout@v7

      - name: Check that OpenSSL has ML-KEM
        run: >-
          python -c 'import ssl;
          print(ssl.OPENSSL_VERSION);
          assert ssl.OPENSSL_VERSION_INFO >= (3, 5), "the ML-KEM tests would be skipped"'

      - run: make install

      # The -openssl<version> cloud and gateway images (SCRUM-55) are only
      # needed until the base image ships the ML-KEM fix itself.
      - name: Check whether the base image still needs the OpenSSL variants
        run: >-
          venv/bin/python -c 'import ssl; from lib import openssl;
          print(ssl.OPENSSL_VERSION);
          openssl.is_vulnerable(ssl.OPENSSL_VERSION) or print(
          f"::warning::python:3.15-slim now ships {ssl.OPENSSL_VERSION}, which has the
          ML-KEM fix: the -openssl images and openssl/ can go (SCRUM-55)")'

      - run: make lint

      - run: make test
