# Run `make certs` (or `make run`) first: it creates the certificates mounted below.
# They and the database live in DATA_DIR (default ./data); the e2e tests set
# their own, and SCAN_INTERVAL (default 5 s) to scan faster.

x-reader: &reader
  image: dev-course/reader
  pull_policy: never  # built locally by reader-1
  networks:
    - reader-vlan
  volumes:
    - ${DATA_DIR:-./data}/certs/ca.pem:/certs/ca.pem:ro
  depends_on:
    - gateway-1
  restart: unless-stopped

x-reader-env: &reader-env
  GATEWAY: 10.10.0.10:8765
  KEYS: key-alice,key-bob,key-carol,key-mallory
  SCAN_INTERVAL: ${SCAN_INTERVAL:-5}

services:
  reader-1:
    <<: *reader
    build:
      context: .
      dockerfile: reader/Dockerfile
    environment:
      <<: *reader-env
      READER_ID: rd-1
      ZONE: front-door

  reader-2:
    <<: *reader
    environment:
      <<: *reader-env
      READER_ID: rd-2
      ZONE: employee-door

  reader-3:
    <<: *reader
    environment:
      <<: *reader-env
      READER_ID: rd-3
      ZONE: server-room

  reader-4:
    <<: *reader
    environment:
      <<: *reader-env
      READER_ID: rd-4
      ZONE: executive-room

  reader-5:
    <<: *reader
    environment:
      <<: *reader-env
      READER_ID: rd-5
      ZONE: loading-dock
      GATEWAY: 10.10.0.11:8765
    depends_on:
      - gateway-2

  gateway-1:
    image: dev-course/gateway
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      CLOUD: cloud:8443
      ID: gw-1
    volumes:
      - ${DATA_DIR:-./data}/certs/ca.pem:/certs/ca.pem:ro
      - ${DATA_DIR:-./data}/certs/gateway.pem:/certs/server.pem:ro
      - ${DATA_DIR:-./data}/certs/gateway.key:/certs/server.key:ro
    networks:
      reader-vlan:
        ipv4_address: 10.10.0.10  # static IP, matches the gateway certificate
      wan: {}
    depends_on:
      - cloud
    restart: unless-stopped

  # Stands in for a gateway that hasn't been upgraded to ML-KEM: it only offers
  # classical X25519, and the cloud falls back to it (see lib/README.md).
  gateway-2:
    image: dev-course/gateway
    pull_policy: never  # built locally by gateway-1
    environment:
      CLOUD: cloud:8443
      ID: gw-2
      OPENSSL_CONF: /opt/lib/openssl/classical.cnf
    volumes:
      - ${DATA_DIR:-./data}/certs/ca.pem:/certs/ca.pem:ro
      - ${DATA_DIR:-./data}/certs/gateway-2.pem:/certs/server.pem:ro
      - ${DATA_DIR:-./data}/certs/gateway-2.key:/certs/server.key:ro
    networks:
      reader-vlan:
        ipv4_address: 10.10.0.11  # static IP, matches the gateway-2 certificate
      wan: {}
    depends_on:
      - cloud
    restart: unless-stopped

  cloud:
    image: dev-course/cloud
    build:
      context: .
      dockerfile: cloud/Dockerfile
    environment:
      DB_PATH: /data/master.db
      # The image accepts hybrid X25519MLKEM768 and falls back to X25519.
      # Once every gateway is upgraded, refuse classical ones (gateway-2):
      # OPENSSL_CONF: /opt/lib/openssl/hybrid-only.cnf
    volumes:
      - ${DATA_DIR:-./data}/cloud:/data
      - ${DATA_DIR:-./data}/certs/cloud.pem:/certs/server.pem:ro
      - ${DATA_DIR:-./data}/certs/cloud.key:/certs/server.key:ro
    ports:
      - "8443:8443"  # gateways (WSS)
      - "8444:8444"  # admin control panel (HTTPS)
    networks:
      - wan
    restart: unless-stopped

  sqlite-web:
    image: coleifer/sqlite-web:latest
    environment:
      SQLITE_DATABASE: master.db
    volumes:
      - ${DATA_DIR:-./data}/cloud:/data  # the same database as the cloud
    ports:
      - "127.0.0.1:8080:8080"  # unauthenticated full DB access: local only
    depends_on:
      - cloud
    restart: unless-stopped

networks:
  # Lock VLAN: IT-restricted L2 segment without internet access.
  reader-vlan:
    internal: true
    ipam:
      config:
        - subnet: 10.10.0.0/24
  # Stands in for the public internet between gateways and the cloud.
  wan: {}
